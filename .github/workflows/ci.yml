name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # GitHub-hosted runners already have Chromium's shared libraries.
      # --with-deps also apt-installs extra fonts, and that step fails closed
      # when azure.archive.ubuntu.com does not resolve.
      - run: npx playwright install chromium
      - run: npm run build
      - run: npm run test:e2e
        env:
          CI: true
      # Signed-in dashboard against a mocked Buffer API. Production probes are manual only.
      - run: npm run test:e2e:signed-in
        env:
          CI: true
